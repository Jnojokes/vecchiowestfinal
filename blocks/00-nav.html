<!-- =========================================================
     BLOCK 00 · SIDEBAR VERTICALE
     Markup minimale, Alpine.js gestisce stato + scroll-spy
     ========================================================= -->
<aside
  id="vw-sidebar"
  class="vw-sidebar"
  :class="{ 'is-open': open }"
  x-data="vwNav('data/nav.json')"
  x-init="init()"
  aria-label="Navigazione principale"
>
  <!-- Brand -->
  <a href="#hero" class="vw-sidebar__brand" data-gunshot>
    <span class="vw-sidebar__brand-mark" aria-hidden="true">
      <!-- mini stella sceriffo -->
      <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
        <path d="M12 2l2.5 5.5L20 8l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5L12 2z"/>
      </svg>
    </span>
    <span class="vw-sidebar__brand-text" x-text="data.brand || 'Vecchio West'"></span>
  </a>

  <!-- Voci di navigazione -->
  <ul class="vw-sidebar__nav" role="list">
    <template x-for="(voce, i) in (data.voci || [])" :key="i">
      <li class="vw-sidebar__item">
        <a
          :href="voce.href"
          class="vw-sidebar__link"
          :class="{ 'is-active': voce.id === activeId }"
          @click="onVoceClick(voce, $event)"
          data-gunshot
        >
          <span class="vw-sidebar__icon" aria-hidden="true" x-html="voce.icon || '•'"></span>
          <span class="vw-sidebar__label" x-text="voce.label"></span>
        </a>
      </li>
    </template>
  </ul>

  <!-- CTA -->
  <div class="vw-sidebar__cta" x-show="data.cta && data.cta.href">
    <a :href="data.cta?.href" target="_blank" rel="noopener" class="vw-btn" data-gunshot>
      <span x-text="data.cta?.label || 'Prenota'"></span>
    </a>
  </div>
</aside>

<!-- Backdrop mobile -->
<div
  class="vw-sidebar__backdrop"
  :class="{ 'is-visible': open }"
  x-data="{ get open(){ return document.querySelector('.vw-sidebar')?.classList.contains('is-open'); } }"
  @click="document.querySelector('.vw-sidebar')?.classList.remove('is-open')"
></div>

<!-- Toggle mobile (burger) -->
<button
  class="vw-sidebar__toggle"
  type="button"
  aria-label="Apri menu"
  aria-expanded="false"
  aria-controls="vw-sidebar"
  onclick="document.querySelector('.vw-sidebar')?.classList.toggle('is-open')"
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="4" y1="7"  x2="20" y2="7"/>
    <line x1="4" y1="12" x2="20" y2="12"/>
    <line x1="4" y1="17" x2="20" y2="17"/>
  </svg>
</button>
