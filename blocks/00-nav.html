<!-- =========================================================
     BLOCK 00 · SIDEBAR VERTICALE + DRAWER MOBILE (B5)
     Markup minimale, Alpine.js gestisce stato + scroll-spy.
     B5: drawer reattivo, ESC, chiusura su click voce,
         focus trap mobile, burger animato croce-on-open.
     ========================================================= -->
<div x-data="vwNav('data/nav.json')" x-init="init()">
  <aside
    class="vw-sidebar"
    :class="{ 'is-open': open }"
    @keydown.escape.window="open && (open = false)"
    @keydown.tab="open && trapFocus($event)"
    aria-label="Navigazione principale"
  >
    <!-- Brand -->
    <a href="#hero" class="vw-sidebar__brand" data-gunshot @click="open = false">
      <span class="vw-sidebar__brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 2l2.5 5.5L20 8l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5L12 2z"/>
        </svg>
      </span>
      <span class="vw-sidebar__brand-text" x-text="data.brand || 'Vecchio West'"></span>
    </a>

    <!-- Voci di navigazione -->
    <ul class="vw-sidebar__nav" role="list">
      <template x-for="(voce, i) in (data.voci || [])" :key="i">
        <li class="vw-sidebar__item">
          <a
            :href="voce.href"
            class="vw-sidebar__link"
            :class="{ 'is-active': voce.id === activeId }"
            @click="onVoceClick(voce, $event)"
            data-gunshot
          >
            <span class="vw-sidebar__icon" aria-hidden="true" x-html="voce.icon || '•'"></span>
            <span class="vw-sidebar__label" x-text="voce.label"></span>
          </a>
        </li>
      </template>
    </ul>

    <!-- CTA -->
    <div class="vw-sidebar__cta" x-show="data.cta && data.cta.href">
      <a :href="data.cta?.href" target="_blank" rel="noopener" class="vw-btn" data-gunshot data-magnetic>
        <span x-text="data.cta?.label || 'Riserva il posto'"></span>
      </a>
    </div>
  </aside>

  <!-- Backdrop mobile -->
  <div
    class="vw-sidebar__backdrop"
    :class="{ 'is-visible': open }"
    x-show="open"
    x-cloak
    @click="open = false"
    aria-hidden="true"
  ></div>

  <!-- Toggle mobile (burger animato 3-line) -->
  <button
    class="vw-sidebar__toggle"
    type="button"
    :aria-expanded="open.toString()"
    aria-controls="vw-sidebar-nav"
    :aria-label="open ? 'Chiudi menu' : 'Apri menu'"
    @click="open = !open"
  >
    <span class="vw-burger" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
  </button>
</div>
