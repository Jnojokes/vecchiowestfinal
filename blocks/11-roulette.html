<!-- =========================================================
     BLOCK 11 · ROULETTE ROSSO/NERO (brief 2026-05-27)
     Flow: scelta colore → spin → esito. Probabilità di vittoria
     in config server-side, NON esposta all'utente.
     Cooldown 24h tramite localStorage.
     ========================================================= -->
<div x-data="vwRoulette('data/roulette.json')" x-init="init()">

  <!-- Trigger floating -->
  <button
    type="button"
    class="vw-roulette-trigger"
    x-show="data.attivo && triggerVisibile"
    x-cloak
    @click="apri()"
    aria-label="Tenta la sorte"
    title="Tenta la sorte"
    data-gunshot
  >
    <img src="assets/img/roulette-trigger.png" alt="" aria-hidden="true" width="56" height="56" />
  </button>

  <!-- Overlay -->
  <div
    id="roulette"
    class="vw-roulette-overlay"
    x-show="overlayOpen"
    x-cloak
    x-transition.opacity.duration.300ms
    @keydown.escape.window="chiudi()"
    @keydown.tab="trapFocus($event)"
    role="dialog"
    aria-modal="true"
    :aria-label="data.titolo || 'Tenta la sorte'"
  >
    <div class="vw-roulette-modal" @click.stop>
      <button class="vw-roulette-close" type="button" @click="chiudi()" aria-label="Chiudi">×</button>

      <p class="eyebrow">Round of the House</p>
      <h2 class="vw-roulette-title" x-text="data.titolo || 'Tenta la sorte'"></h2>

      <!-- STEP 1 · scelta colore (visibile finché userChoice non è settato e non c'è risultato) -->
      <div class="vw-roulette-step vw-roulette-step--choose" x-show="!userChoice && !risultato && !cooldownAttivo" x-cloak>
        <p class="vw-roulette-sub" x-text="data.sottotitolo_choose || 'Scegli il tuo colore.'"></p>
        <p class="vw-roulette-sub-faint" x-text="data.sottotitolo_choose_sub || 'Punta su rosso o nero. Poi gira la ruota.'"></p>
        <div class="vw-roulette-colors">
          <button
            type="button"
            class="vw-roulette-color vw-roulette-color--red"
            @click="scegliColore('red')"
            data-gunshot
            :aria-label="`Scegli ${data.label_red || 'Rosso'}`"
          >
            <span x-text="data.label_red || 'Rosso'"></span>
          </button>
          <button
            type="button"
            class="vw-roulette-color vw-roulette-color--black"
            @click="scegliColore('black')"
            data-gunshot
            :aria-label="`Scegli ${data.label_black || 'Nero'}`"
          >
            <span x-text="data.label_black || 'Nero'"></span>
          </button>
        </div>
      </div>

      <!-- STEP 2 · spin (visibile dopo scelta colore) -->
      <div class="vw-roulette-step vw-roulette-step--spin" x-show="userChoice && !risultato" x-cloak>
        <p class="vw-roulette-sub">
          Hai puntato su
          <strong class="vw-roulette-choice-tag" :class="`vw-roulette-choice-tag--${userChoice}`" x-text="userChoice === 'red' ? (data.label_red || 'Rosso') : (data.label_black || 'Nero')"></strong>
        </p>

        <div class="vw-roulette-wheel-wrap">
          <div class="vw-roulette-pointer" aria-hidden="true"></div>
          <div
            class="vw-roulette-wheel"
            :class="{ 'is-spinning': spinning }"
            :style="`transform: rotate(${rotazioneTotale}deg);`"
          ></div>
          <div class="vw-roulette-hub" aria-hidden="true">
            <span x-text="hubLabel"></span>
          </div>
        </div>

        <div class="vw-roulette-actions">
          <button
            type="button"
            class="vw-btn"
            @click="spin()"
            :disabled="spinning"
            data-gunshot
          >
            <span x-show="!spinning" x-text="data.cta_spin || 'Gira la ruota'"></span>
            <span x-show="spinning">Sta girando…</span>
          </button>
          <button type="button" class="vw-btn vw-btn--ghost" @click="reset()" x-show="!spinning">Cambia colore</button>
        </div>
      </div>

      <!-- Cooldown -->
      <div class="vw-roulette-cooldown" x-show="cooldownAttivo && !risultato" x-cloak>
        Hai già tentato la sorte. Torna fra <span x-text="cooldownFormatted"></span>.
      </div>

      <!-- STEP 3 · risultato -->
      <div class="vw-roulette-result" x-show="risultato" x-cloak>
        <template x-if="risultato === 'win'">
          <div>
            <h3 class="vw-roulette-result__title">🎉 <span x-text="data.premio_titolo || 'Hai vinto una birra alla spina!'"></span></h3>
            <p x-text="data.premio_descrizione || 'Una birra alla spina offerta dalla casa.'"></p>
            <span class="vw-roulette-result__code" x-text="codice"></span>
            <p class="vw-roulette-meta">Mostra questo codice al banco entro la chiusura della serata. Valido una sola volta.</p>
            <div class="vw-roulette-actions" style="margin-top: 1.2rem;">
              <a
                :href="`https://wa.me/${(data.whatsapp_numero || '393520029607').replace(/\D/g,'')}?text=${encodeURIComponent((data.whatsapp_msg_template || 'Ho vinto una birra alla spina. Codice: {CODICE}').replace('{CODICE}', codice))}`"
                target="_blank"
                rel="noopener"
                class="vw-btn"
                data-gunshot
                data-cta="roulette-win-whatsapp"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" style="margin-right:0.4rem;vertical-align:-3px"><path d="M20.52 3.48A11.95 11.95 0 0 0 12 0C5.37 0 0 5.37 0 12c0 2.11.55 4.16 1.6 5.97L0 24l6.18-1.62A11.94 11.94 0 0 0 12 24c6.63 0 12-5.37 12-12 0-3.19-1.24-6.18-3.48-8.52zM12 22a9.93 9.93 0 0 1-5.07-1.39l-.36-.21-3.66.96.98-3.57-.24-.37A9.93 9.93 0 0 1 2 12C2 6.48 6.48 2 12 2s10 4.48 10 10-4.48 10-10 10z"/></svg>
                <span x-text="data.cta_prenota_win_testo || 'Prenota su WhatsApp'"></span>
              </a>
            </div>
          </div>
        </template>
        <template x-if="risultato === 'lose'">
          <div>
            <h3 class="vw-roulette-result__title" x-text="data.consolazione_titolo || 'Niente da fare, cowboy.'"></h3>
            <p x-text="data.consolazione || 'La fortuna gira veloce — riprova domani.'"></p>
            <div class="vw-roulette-actions" style="margin-top: 1rem;">
              <button type="button" class="vw-btn vw-btn--ghost" @click="chiudi()">Chiudi</button>
            </div>
          </div>
        </template>
      </div>

      <p class="vw-roulette-meta" x-show="data.disclaimer" x-text="data.disclaimer"></p>
    </div>
  </div>

</div>

<style>
  /* Step 1 · scelta colore */
  .vw-roulette-step--choose {
    margin: var(--space-md) 0;
    text-align: center;
  }
  .vw-roulette-sub-faint {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--vw-paper-2);
    letter-spacing: 0.08em;
    margin-bottom: var(--space-md);
  }
  .vw-roulette-colors {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: var(--space-sm);
  }
  .vw-roulette-color {
    flex: 1 1 130px;
    max-width: 200px;
    min-height: 130px;
    border-radius: var(--radius-md);
    border: 2px solid var(--vw-gold);
    cursor: pointer;
    font-family: var(--font-display);
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--vw-paper);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
  }
  .vw-roulette-color--red {
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.10), transparent 60%),
      linear-gradient(180deg, #a83333, #8B1A1A);
  }
  .vw-roulette-color--black {
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent 60%),
      linear-gradient(180deg, #2a2a2a, #1A1A1A);
  }
  .vw-roulette-color:hover {
    transform: translateY(-3px);
    border-color: var(--vw-gold-2);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.6), 0 0 0 4px rgba(200, 155, 60, 0.18);
  }
  .vw-roulette-color:active { transform: scale(0.97); }

  /* Step 2 · tag scelta */
  .vw-roulette-choice-tag {
    display: inline-block;
    padding: 0.18rem 0.6rem;
    border-radius: 999px;
    font-family: var(--font-headline);
    font-size: 0.85rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0.25rem;
    color: var(--vw-paper);
  }
  .vw-roulette-choice-tag--red {
    background: linear-gradient(180deg, #a83333, #8B1A1A);
    border: 1px solid rgba(200, 155, 60, 0.5);
  }
  .vw-roulette-choice-tag--black {
    background: linear-gradient(180deg, #2a2a2a, #1A1A1A);
    border: 1px solid rgba(200, 155, 60, 0.5);
  }
</style>
