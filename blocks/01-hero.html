<!-- ============================================================
     BLOCK 01 · HERO SALOON
     Asset cinematic vw-hero-desktop.png / vw-hero-mobile.png:
     contiene gia titolo VECCHIO WEST 3D + cowboys + sunset desert +
     STAR PRENOTA + tagline italica + scroll hint.
     UI HTML fornisce hitbox cliccabili invisibili sopra l'asset.
     ============================================================ -->
<section
  id="hero"
  class="vw-saloon-hero"
  x-data="vwBlock('hero', 'data/hero.json')"
  role="banner"
  aria-label="Vecchio West · Spaghetti western italiano"
>
  <h1 class="vw-sr-only">Vecchio West · C&rsquo;era una volta la fame</h1>

  <picture class="vw-saloon-hero__bg">
    <source media="(max-aspect-ratio: 1/1)" srcset="assets/img/hero/vw-hero-mobile.png">
    <img src="assets/img/hero/vw-hero-desktop.png" alt="" loading="eager" fetchpriority="high" />
  </picture>

  <!-- Hitbox CTA cliccabili invisibili sopra l'immagine -->
  <a
    class="vw-hero-hitbox vw-hero-hitbox--star"
    :href="data.cta_primario?.link || 'https://wa.me/393520029607?text=Salve%20forestiero%2C%20vorrei%20riservare%20un%20tavolo'"
    target="_blank"
    rel="noopener"
    data-gunshot
    data-cta="hero-star-prenota"
  >Prenota il tavolo</a>

  <a
    class="vw-hero-hitbox vw-hero-hitbox--menu"
    href="#menu"
    data-cta="hero-vedi-menu"
  >Vedi il menù</a>

  <a
    class="vw-hero-hitbox vw-hero-hitbox--scroll"
    href="#menu"
    data-cta="hero-entra-saloon"
  >Entra nel saloon</a>
</section>

<style>
  /* Screen-reader only utility */
  .vw-sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
