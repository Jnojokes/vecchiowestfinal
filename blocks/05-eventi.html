<!-- ============================================================
     BLOCK 05 · EVENTI PROSSIMI (DINAMICO)
     Dati: /data/eventi.json
     Mostra solo eventi con data > oggi, max 3
     ============================================================ -->
<section
  id="eventi"
  class="vw-section vw-eventi"
  x-data="vwEventi('data/eventi.json')"
  x-cloak
>
  <div class="vw-container">
    <div class="vw-section__head">
      <p class="eyebrow">Calendario</p>
      <h2>Prossimi eventi al saloon</h2>
      <div class="vw-divider"><svg viewBox="0 0 24 24"><path d="M12 2l2.39 7.35H22l-6.19 4.5L18.2 21 12 16.5 5.8 21l2.39-7.15L2 9.35h7.61z"/></svg></div>
    </div>

    <div class="vw-eventi__grid" x-show="eventiVisibili.length">
      <template x-for="ev in eventiVisibili" :key="ev.id">
        <article class="vw-eventi__card vw-card vw-card--wood" :class="`theme-${ev.theme||'western'}`">
          <div class="vw-eventi__media">
            <img :src="ev.immagine" :alt="ev.titolo" loading="lazy" />
          </div>
          <div class="vw-eventi__body">
            <!-- Urgency chip (B8) -->
            <template x-if="labelRelativa(ev.data_inizio)">
              <span class="vw-evento__urgency" x-text="labelRelativa(ev.data_inizio)"></span>
            </template>
            <time class="vw-eventi__data" :datetime="ev.data_inizio">
              <strong x-text="formatGiorno(ev.data_inizio)"></strong>
              <span x-text="formatMese(ev.data_inizio)"></span>
              <em x-text="formatOra(ev.data_inizio)"></em>
            </time>
            <h3 class="vw-eventi__title" x-text="ev.titolo"></h3>
            <p class="vw-eventi__desc" x-text="ev.descrizione_breve"></p>
            <a :href="addToCalendarUrl(ev)" target="_blank" rel="noopener" class="vw-btn vw-btn--ghost vw-eventi__cta" x-text="ev.cta_testo || 'Salva la data'"></a>
          </div>
        </article>
      </template>
    </div>

    <p class="vw-eventi__empty" x-show="!eventiVisibili.length" x-text="data.empty_message || 'Nessun evento programmato nei prossimi giorni. Torna a trovarci presto.'"></p>
  </div>
</section>

<style>
  .vw-eventi__grid {
    display: grid;
    gap: var(--space-md);
    grid-template-columns: 1fr;
  }
  @media (min-width: 700px) {
    .vw-eventi__grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1000px) {
    .vw-eventi__grid { grid-template-columns: repeat(3, 1fr); }
  }

  .vw-eventi__card {
    background: var(--vw-bg-2);
    border: 1px solid rgba(200, 155, 60, 0.2);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .vw-eventi__card:hover {
    transform: translateY(-4px);
    border-color: var(--vw-gold);
    box-shadow: var(--shadow-md);
  }
  .vw-eventi__card.theme-latin { border-top: 3px solid var(--vw-latin-magenta); }
  .vw-eventi__card.theme-western { border-top: 3px solid var(--vw-gold); }
  /* Override .vw-card padding (B1) per card eventi: il padding sta in __body */
  .vw-eventi__card.vw-card { padding: 0; }

  .vw-eventi__media {
    aspect-ratio: 16/10;
    overflow: hidden;
    background: var(--vw-bg);
  }
  .vw-eventi__media img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: sepia(0.25) saturate(0.9);
  }
  .vw-eventi__card.theme-latin .vw-eventi__media img { filter: saturate(1.1) contrast(1.05); }

  .vw-eventi__body { padding: var(--space-md); }
  .vw-eventi__data {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
    color: var(--vw-gold);
    font-family: var(--font-headline);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .vw-eventi__data strong { font-size: 1.4rem; line-height: 1; }
  .vw-eventi__data span { font-size: 0.85rem; }
  .vw-eventi__data em { font-style: normal; margin-left: auto; color: var(--vw-paper-2); font-size: 0.85rem; }
  .vw-eventi__title {
    font-family: var(--font-display);
    font-size: 1.25rem;
    margin-bottom: 0.5rem;
  }
  .vw-eventi__desc {
    color: var(--vw-paper-2);
    font-size: 0.9rem;
    margin-bottom: var(--space-md);
  }
  .vw-eventi__cta { width: 100%; }
  .vw-eventi__empty {
    text-align: center;
    color: var(--vw-paper-2);
    padding: var(--space-xl) 0;
    font-style: italic;
  }

  /* Urgency chip (B8) */
  .vw-evento__urgency {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    background: var(--vw-gold);
    color: var(--vw-bg);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
  }
</style>
