<!-- ============================================================
     BLOCK 03 · MENU TABS
     Dati: /data/menu.json
     ============================================================ -->
<section
  id="menu"
  class="vw-section vw-menu"
  x-data="vwMenu('data/menu.json')"
  x-cloak
>
  <div class="vw-container">
    <div class="vw-section__head">
      <p class="eyebrow">Il menù</p>
      <h2>Spaghetti western italiano</h2>
      <div class="vw-divider"><svg viewBox="0 0 24 24"><path d="M12 2l2.39 7.35H22l-6.19 4.5L18.2 21 12 16.5 5.8 21l2.39-7.15L2 9.35h7.61z"/></svg></div>
      <p class="vw-menu__intro">Scottona marchigiana, olive ascolana, salame ventricina. Sourcing italiano, cottura sul barbecue del tuo tavolo.</p>
    </div>

    <!-- Tab nav -->
    <div class="vw-menu__tabs-wrap">
      <nav class="vw-menu__tabs vw-menu__tabs--scrollable" role="tablist" data-scroll-mask>
        <template x-for="sezione in data.sezioni" :key="sezione.id">
          <button
            class="vw-menu__tab"
            :class="{ 'is-active': activeTab === sezione.id }"
            @click="setTab(sezione.id)"
            :aria-selected="activeTab === sezione.id"
            role="tab"
          >
            <span x-text="sezione.titolo"></span>
          </button>
        </template>
      </nav>
    </div>

    <!-- Allergen filter (multi-toggle chip) -->
    <div class="vw-menu__filter vw-allergen-filter" x-show="data.ricerca_allergeni_attiva" role="group" aria-label="Filtra per allergeni da escludere">
      <span class="vw-allergen-filter__label">Escludi:</span>
      <template x-for="all in allergeniDisponibili" :key="all">
        <button type="button"
                class="vw-chip vw-chip--toggle"
                :class="{ 'is-active': filtriAllergeni.includes(all) }"
                :aria-pressed="filtriAllergeni.includes(all).toString()"
                @click="toggleAllergene(all)">
          <span x-text="all"></span>
        </button>
      </template>
      <button type="button"
              class="vw-chip vw-chip--clear"
              x-show="filtriAllergeni.length > 0"
              @click="azzeraFiltri()">
        Azzera filtri
      </button>
    </div>

    <!-- Piatti -->
    <div class="vw-menu__items" role="tabpanel">
      <template x-for="item in itemsVisibili" :key="item.nome">
        <article class="vw-menu__item">
          <div class="vw-menu__item-body">
            <header class="vw-menu__item-head">
              <h3 class="vw-menu__item-name" x-text="item.nome"></h3>
              <span class="vw-menu__item-price" x-text="`€ ${item.prezzo}`"></span>
            </header>
            <p class="vw-menu__item-desc" x-text="item.descrizione"></p>
            <div class="vw-menu__item-badges" x-show="item.badge?.length">
              <template x-for="b in item.badge" :key="b">
                <span class="vw-badge" :class="`vw-badge--${b.toLowerCase()}`" x-text="b"></span>
              </template>
            </div>
            <div class="vw-menu__item-aller" x-show="item.allergeni?.length" role="list" aria-label="Allergeni">
              <span class="vw-text-mono vw-menu__item-aller-label">Allergeni</span>
              <template x-for="a in (item.allergeni || [])" :key="a">
                <span class="vw-chip vw-chip--allergen" role="listitem" x-text="a"></span>
              </template>
            </div>
          </div>
        </article>
      </template>
      <p class="vw-menu__empty" x-show="itemsVisibili.length === 0">
        Nessun piatto disponibile con questo filtro.
      </p>
    </div>
  </div>
</section>

<style>
  .vw-section__head { text-align: center; margin-bottom: var(--space-lg); }
  .vw-menu__intro { max-width: 640px; margin: 0 auto; color: var(--vw-paper-2); }

  .vw-menu__tabs-wrap { position: relative; }
  .vw-menu__tabs {
    display: flex;
    gap: 0.25rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    margin: var(--space-md) -1rem;
    padding-left: 1rem;
    padding-right: 1rem;
    scrollbar-width: none;
  }
  .vw-menu__tabs::-webkit-scrollbar { display: none; }
  .vw-menu__tabs--scrollable {
    -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 32px,
      #000 calc(100% - 32px),
      transparent 100%
    );
    mask-image: linear-gradient(
      to right,
      transparent 0,
      #000 32px,
      #000 calc(100% - 32px),
      transparent 100%
    );
  }
  .vw-menu__tab {
    background: transparent;
    border: 1px solid var(--vw-dust);
    color: var(--vw-paper-2);
    padding: 0.6rem 1.2rem;
    font-family: var(--font-headline);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 0.82rem;
    cursor: pointer;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    transition: all .2s ease;
  }
  .vw-menu__tab:hover { border-color: var(--vw-gold); color: var(--vw-gold); }
  .vw-menu__tab.is-active {
    background: var(--vw-gold);
    border-color: var(--vw-gold);
    color: var(--vw-bg);
  }

  .vw-menu__filter {
    margin: var(--space-md) 0;
    text-align: right;
    font-size: 0.85rem;
  }
  .vw-menu__filter-label {
    display: inline-flex; align-items: center; gap: 0.5rem;
    color: var(--vw-paper-2);
  }
  .vw-menu__filter select {
    background: var(--vw-bg-2);
    color: var(--vw-paper);
    border: 1px solid var(--vw-dust);
    padding: 0.35rem 0.6rem;
    font-family: var(--font-body);
    border-radius: var(--radius-sm);
  }

  .vw-menu__items {
    display: grid;
    gap: var(--space-md);
    grid-template-columns: 1fr;
  }
  @media (min-width: 768px) {
    .vw-menu__items { grid-template-columns: 1fr 1fr; gap: var(--space-md) var(--space-lg); }
  }

  .vw-menu__item {
    background: rgba(240, 227, 200, 0.04);
    border: 1px solid rgba(200, 155, 60, 0.18);
    border-radius: var(--radius-md);
    padding: var(--space-md);
    transition: border-color .2s ease, transform .2s ease;
  }
  .vw-menu__item:hover { border-color: var(--vw-gold); transform: translateY(-2px); }

  .vw-menu__item-head {
    display: flex; align-items: baseline; gap: 1rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px dashed rgba(200, 155, 60, 0.3);
    padding-bottom: 0.5rem;
  }
  .vw-menu__item-name {
    flex: 1;
    font-family: var(--font-display);
    font-size: 1.15rem;
    color: var(--vw-paper);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .vw-menu__item-price {
    font-family: var(--font-headline);
    color: var(--vw-gold);
    font-size: 1.1rem;
    white-space: nowrap;
  }
  .vw-menu__item-desc { color: var(--vw-paper-2); font-size: 0.93rem; margin-bottom: 0.6rem; }
  .vw-menu__item-badges { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
  .vw-menu__item-aller {
    margin-top: 0.5rem;
    font-size: 0.78rem;
    color: var(--vw-sand);
  }
  .vw-menu__empty {
    text-align: center;
    color: var(--vw-paper-2);
    padding: var(--space-lg);
    font-style: italic;
  }
</style>
