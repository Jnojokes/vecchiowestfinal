<!-- ============================================================
     BLOCK 03 · MENU "I RICERCATI" (WANTED poster board)
     Dati: /data/menu.json
     ============================================================ -->
<section
  id="menu"
  class="vw-section vw-menu"
  x-data="vwMenu('data/menu.json')"
  x-cloak
>
  <div class="vw-container">
    <header class="vw-section__head">
      <p class="vw-saloon-eyebrow">Il menu</p>
      <h2 class="vw-saloon-title">I Ricercati</h2>
      <p class="vw-saloon-tagline">Spaghetti western italiano. Premiati al morso.</p>
    </header>

    <!-- Tab nav con stella sceriffo sull'attivo -->
    <div class="vw-menu__tabs-wrap">
      <nav class="vw-menu__tabs vw-menu__tabs--scrollable vw-menu__tabs--saloon" role="tablist">
        <template x-for="sezione in data.sezioni" :key="sezione.id">
          <button
            class="vw-menu__tab"
            :class="{ 'is-active': activeTab === sezione.id }"
            @click="setTab(sezione.id)"
            :aria-selected="activeTab === sezione.id"
            role="tab"
          >
            <span class="vw-star-small" aria-hidden="true" x-show="activeTab === sezione.id"></span>
            <span x-text="sezione.titolo"></span>
          </button>
        </template>
      </nav>
    </div>

    <!-- Filtro allergeni chip multi-toggle -->
    <div class="vw-allergen-filter" x-show="data.ricerca_allergeni_attiva" role="group" aria-label="Filtra per allergeni da escludere">
      <span class="vw-allergen-filter__label">Escludi:</span>
      <template x-for="a in allergeniDisponibili" :key="a">
        <button
          type="button"
          class="vw-chip vw-chip--toggle"
          :class="{ 'is-active': filtriAllergeni.includes(a) }"
          :aria-pressed="filtriAllergeni.includes(a).toString()"
          @click="toggleAllergene(a)"
        >
          <span x-text="a"></span>
        </button>
      </template>
      <button
        type="button"
        class="vw-chip--clear"
        x-show="filtriAllergeni.length > 0"
        @click="filtriAllergeni = []"
      >Azzera filtri</button>
    </div>

    <!-- WANTED poster board -->
    <div class="vw-wanted-board" role="tabpanel">
      <div class="vw-wanted-grid">
        <template x-for="item in itemsVisibili" :key="item.nome">
          <article class="vw-wanted" tabindex="0">
            <header class="vw-wanted__head">
              <span>Wanted</span>
            </header>
            <img
              class="vw-wanted__img"
              :src="item.foto"
              :alt="`${item.nome} — ${item.descrizione}`"
              loading="lazy"
            />
            <h3 class="vw-wanted__name" x-text="item.nome"></h3>
            <p class="vw-wanted__reward">Reward <strong x-text="`€ ${item.prezzo}`"></strong></p>
            <p class="vw-wanted__desc" x-text="item.descrizione" x-show="item.descrizione"></p>
            <div class="vw-menu__item-aller" x-show="item.allergeni?.length" role="list" aria-label="Allergeni" style="justify-content: center;">
              <template x-for="a in (item.allergeni || [])" :key="a">
                <span class="vw-chip vw-chip--allergen" role="listitem" x-text="a"></span>
              </template>
            </div>
          </article>
        </template>
      </div>
      <p class="vw-menu__empty" x-show="itemsVisibili.length === 0">
        Nessun ricercato in questa sezione con questi filtri.
      </p>
    </div>
  </div>
</section>

<style>
  .vw-section__head { text-align: center; margin-bottom: var(--space-lg); }

  .vw-menu__tabs {
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 0.25rem;
    overflow-x: auto;
    padding: 0.5rem 1rem;
    margin: var(--space-md) auto;
    scrollbar-width: none;
  }
  .vw-menu__tabs::-webkit-scrollbar { display: none; }
  .vw-menu__tab {
    background: transparent;
    border: 0;
    color: var(--vw-paper-2);
    padding: 0.6rem 1rem;
    font-family: var(--font-headline);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.82rem;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    transition: color .2s ease;
    position: relative;
  }
  .vw-menu__tab:not(:last-child)::after {
    content: '·';
    position: absolute;
    right: -0.1rem;
    color: var(--vw-dust);
  }
  .vw-menu__tab:hover { color: var(--vw-paper); }
  .vw-menu__tab.is-active { color: var(--vw-gold); }

  .vw-menu__empty {
    text-align: center;
    color: var(--vw-paper-2);
    padding: var(--space-lg);
    font-family: var(--font-script);
    font-size: 1.2rem;
  }
</style>
