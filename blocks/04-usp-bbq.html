<!-- ============================================================
     BLOCK 04 · USP HERO BBQ AL TAVOLO
     Dati: /data/usp_bbq.json
     ============================================================ -->
<section
  id="bbq"
  class="vw-section vw-usp"
  x-data="vwBlock('usp_bbq', 'data/usp_bbq.json')"
  x-cloak
>
  <div class="vw-container vw-usp__grid">
    <div class="vw-usp__media">
      <img
        :src="data.foto"
        :alt="data.foto_alt"
        class="vw-usp__img"
        loading="lazy"
      />
      <div class="vw-usp__media-frame" aria-hidden="true"></div>
    </div>

    <div class="vw-usp__content">
      <p class="eyebrow">L'USP del Vecchio West</p>
      <h2 class="vw-usp__title" x-text="data.titolo"></h2>
      <p class="vw-usp__claim" x-text="data.claim"></p>

      <ol class="vw-usp__steps">
        <template x-for="(step, i) in data.step" :key="i">
          <li class="vw-usp__step">
            <span class="vw-usp__step-num" x-text="step.numero"></span>
            <div>
              <h3 class="vw-usp__step-title" x-text="step.titolo"></h3>
              <p class="vw-usp__step-text" x-text="step.testo"></p>
            </div>
          </li>
        </template>
      </ol>

      <a :href="data.cta?.link" class="vw-btn" x-text="data.cta?.testo"></a>
    </div>
  </div>
</section>

<style>

  @media (min-width: 900px) {

  .vw-usp__media { position: relative; }
  .vw-usp__img {
    width: 100%;

    object-fit: cover;
    filter: sepia(0.3) saturate(0.9) contrast(1.05);
    border-radius: var(--radius-md);
  }
  .vw-usp__media-frame {
    position: absolute;
    inset: -10px;
    border: 1px solid var(--vw-gold);
    border-radius: var(--radius-md);
    pointer-events: none;
    z-index: -1;
  }
  .vw-usp__title { margin: 0.4rem 0 var(--space-sm); }
  .vw-usp__claim {
    font-size: 1.05rem;

  }

    color: var(--vw-paper);

  }
