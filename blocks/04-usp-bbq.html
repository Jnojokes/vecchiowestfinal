<!-- ============================================================
     BLOCK 04 · USP HERO BBQ AL TAVOLO
     Dati: /data/usp_bbq.json
     ============================================================ -->
<section
  id="all-you-can-eat"
  class="vw-section vw-usp"
  x-data="vwBlock('usp_bbq', 'data/usp_bbq.json')"
  x-cloak
>
  <div class="vw-container vw-usp__grid">
    <div class="vw-usp__media">
      <template x-if="data.foto">
        <img
          :src="data.foto"
          :alt="data.foto_alt"
          class="vw-usp__img"
          loading="lazy"
        />
      </template>
      <template x-if="!data.foto">
        <div class="vw-usp__placeholder" aria-hidden="true">
          <svg viewBox="0 0 80 80" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="14" y="14" width="52" height="52" rx="2"/>
            <circle cx="40" cy="40" r="12"/>
            <path d="M14 56l16-16 12 12 10-10 14 14"/>
          </svg>
          <p>Foto in arrivo</p>
        </div>
      </template>
      <div class="vw-usp__media-frame" aria-hidden="true"></div>
    </div>

    <div class="vw-usp__content">
      <p class="eyebrow">Il format</p>
      <h2 class="vw-usp__title" x-text="data.titolo"></h2>
      <p class="vw-usp__claim" x-text="data.claim"></p>

      <div class="vw-usp__price-row" x-show="data.prezzo_label || data.dettagli">
        <span class="vw-usp__price" x-show="data.prezzo_label" x-text="data.prezzo_label"></span>
        <span class="vw-usp__info" x-show="data.dettagli" x-text="data.dettagli"></span>
      </div>

      <ol class="vw-usp__steps">
        <template x-for="(step, i) in data.step" :key="i">
          <li class="vw-usp__step">
            <span class="vw-usp__step-num" x-text="step.numero"></span>
            <div>
              <h3 class="vw-usp__step-title" x-text="step.titolo"></h3>
              <p class="vw-usp__step-text" x-text="step.testo"></p>
            </div>
          </li>
        </template>
      </ol>

      <a :href="data.cta?.link" class="vw-btn" x-text="data.cta?.testo"></a>
    </div>
  </div>
</section>

<style>
  .vw-usp { background: var(--vw-bg-2); position: relative; }
  .vw-usp__grid {
    display: grid;
    gap: var(--space-lg);
    grid-template-columns: 1fr;
    align-items: center;
  }
  @media (min-width: 900px) {
    .vw-usp__grid { grid-template-columns: 1fr 1fr; gap: var(--space-2xl); }
  }
  .vw-usp__media { position: relative; }
  .vw-usp__img {
    width: 100%;
    aspect-ratio: 4/5;
    object-fit: cover;
    filter: sepia(0.3) saturate(0.9) contrast(1.05);
    border-radius: var(--radius-md);
  }
  /* Placeholder se foto non ancora disponibile */
  .vw-usp__placeholder {
    width: 100%;
    aspect-ratio: 4/5;
    background:
      repeating-linear-gradient(45deg, rgba(200, 155, 60, 0.03) 0 12px, rgba(200, 155, 60, 0.06) 12px 24px),
      var(--vw-bg-2);
    border: 1px solid rgba(200, 155, 60, 0.35);
    border-radius: var(--radius-md);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    color: var(--vw-gold);
  }
  .vw-usp__placeholder p {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--vw-paper-2);
    margin: 0;
  }
  .vw-usp__media-frame {
    position: absolute;
    inset: -10px;
    border: 1px solid var(--vw-gold);
    border-radius: var(--radius-md);
    pointer-events: none;
    z-index: -1;
  }
  .vw-usp__title { margin: 0.4rem 0 var(--space-sm); }
  .vw-usp__claim {
    font-size: 1.05rem;
    color: var(--vw-paper-2);
    margin-bottom: var(--space-md);
    max-width: 50ch;
  }
  .vw-usp__price-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.5rem 1rem;
    margin-bottom: var(--space-md);
  }
  .vw-usp__price {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    line-height: 1;
    color: var(--vw-gold-2);
  }
  .vw-usp__info {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--vw-paper-2);
  }
  .vw-usp__steps {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
    margin-bottom: var(--space-lg);
  }
  .vw-usp__step {
    display: flex;
    gap: var(--space-md);
    align-items: flex-start;
  }
  .vw-usp__step-num {
    font-family: var(--font-display);
    font-size: 1.6rem;
    color: var(--vw-gold);
    min-width: 2.5rem;
    line-height: 1;
  }
  .vw-usp__step-title {
    font-family: var(--font-headline);
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--vw-paper);
    margin-bottom: 0.25rem;
  }
  .vw-usp__step-text {
    color: var(--vw-paper-2);
    font-size: 0.92rem;
  }
</style>
