  <style>
    /* Critical inline CSS · splash overlay (no dependence on saloon.css) */
    .vw-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:radial-gradient(circle at center,rgba(60,38,22,.95),rgba(15,10,6,1)),#1a120b;transition:opacity .5s ease,visibility .5s ease}
    .vw-splash__logo{width:clamp(140px,28vw,220px);height:auto;animation:vw-splash-pulse 2s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
    .vw-splash__text{font-family:'Special Elite','Courier New',monospace;font-size:.78rem;letter-spacing:.32em;color:#c89b3c;text-transform:uppercase;text-align:center;margin:0}
    @keyframes vw-splash-pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.06);opacity:1}}
    html:not(.vw-loading) .vw-splash{opacity:0;visibility:hidden;pointer-events:none}
    @media (prefers-reduced-motion: reduce){.vw-splash__logo{animation:none}}
  </style>
