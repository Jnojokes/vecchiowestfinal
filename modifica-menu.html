<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a120b" />
  <meta name="color-scheme" content="dark" />

  <!-- Pagina privata: niente indicizzazione, nessun link interno la punta. -->
  <meta name="robots" content="noindex, nofollow" />

  <title>Modifica menù · Vecchio West</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />

  <!-- global.css porta @import tokens.css (brand) + base/bottoni/.vw-badge/.vw-chip -->
  <link rel="stylesheet" href="css/global.css?v=20260615b" />
  <link rel="stylesheet" href="css/modifica-menu.css?v=20260615b" />

  <!-- =========================================================
       Componente Alpine "vwEditor" registrato PRIMA del caricamento
       di Alpine (evento alpine:init). Pagina autonoma: NON usa app.js.
       ========================================================= -->
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('vwEditor', () => ({
        // Set ammessi (devono combaciare col server e col CSS .vw-badge--<lowercase>)
        BADGES: ['TOP', 'PICCANTE', 'MARCHIGIANO', 'VEG', 'VEGAN', 'NUOVO'],
        ALLERGENI: ['glutine', 'lattosio', 'sedano', 'sesamo', 'uova'],
        USERNAME: 'admin',        // utente fisso (non è un segreto): la protezione vera è la password lato server
        DRAFT_KEY: 'vw_menu_draft_v1', // bozza locale (sostituisce il vecchio "scarica backup")

        // Stato
        step: 'login',            // 'login' | 'editor'
        booting: !!sessionStorage.getItem('vw_admin_pw'), // auto-login in corso → evita flash della card login
        username: '',
        password: '',
        loginError: '',
        loading: false,           // spinner login / caricamento iniziale
        loadError: '',
        publishing: false,
        publishMsg: '',
        publishError: '',
        avvisoValidazione: '',    // riepilogo breve quando ci sono campi da correggere
        menu: { ricerca_allergeni_attiva: true, sezioni: [] },
        dirty: false,
        sezioneAperta: null,      // accordion: id dell'UNICA sezione aperta (non serializzato nel menu)
        nuoveSezioni: {},         // { [idTemporaneo]: true } sezioni create/non ancora pubblicate
        erroriCampo: {},          // { "<si>-<ii>": { nome?:msg, prezzo?:msg } } — validazione inline
        q: '',                    // testo di ricerca piatti
        mostraTornaSu: false,     // bottone "torna su"
        bozzaDisponibile: false,  // c'è una bozza locale non pubblicata da ripristinare
        bozzaTs: 0,               // timestamp della bozza
        bozzaErrore: false,       // localStorage non disponibile (modalità privata / memoria piena)
        _draftTimer: null,        // debounce salvataggio bozza (non reattivo)
        _scrollTicking: false,    // throttle scroll (non reattivo)

        // ---------- Ciclo di vita ----------
        async init() {
          // Avviso se si chiude la pagina con modifiche non salvate (salvando subito la bozza in coda).
          window.addEventListener('beforeunload', (e) => {
            if (this.dirty) { this.flushBozza(); e.preventDefault(); e.returnValue = ''; }
          });
          // Su mobile beforeunload è inaffidabile: salva la bozza quando la pagina passa in background.
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && this.dirty) this.flushBozza();
          });
          window.addEventListener('pagehide', () => { if (this.dirty) this.flushBozza(); });
          // "Torna su": compare dopo un po' di scroll (throttle con rAF).
          window.addEventListener('scroll', () => {
            if (this._scrollTicking) return;
            this._scrollTicking = true;
            requestAnimationFrame(() => {
              this.mostraTornaSu = window.scrollY > 500;
              this._scrollTicking = false;
            });
          }, { passive: true });

          // Auto-login se la password è già in sessionStorage (riverifica lato server).
          const saved = sessionStorage.getItem('vw_admin_pw');
          if (saved) {
            this.password = saved;
            this.loading = true;
            try {
              const ok = await this.verifica();
              if (ok) { await this.loadMenu(); this.step = 'editor'; this.controllaBozza(); }
              else { this.logout(); }
            } finally {
              this.loading = false;
              this.booting = false;
            }
          }
        },

        // ---------- Autenticazione ----------
        async verifica() {
          try {
            const r = await this.api({ action: 'verify' });
            return r.status === 200;
          } catch (_) { return false; }
        },
        async login() {
          this.loginError = '';
          if (!this.username || !this.password) { this.loginError = 'Inserisci utente e password.'; return; }
          // L'utente è fisso ('admin'); la password è verificata dal server.
          if (this.username.trim().toLowerCase() !== this.USERNAME) { this.loginError = 'Utente o password errati.'; return; }
          this.loading = true;
          try {
            const r = await this.api({ action: 'verify' });
            if (r.status === 401) { this.loginError = 'Utente o password errati.'; return; }
            if (r.status !== 200) { this.loginError = (r.body && r.body.error) || ('Errore server (' + r.status + ').'); return; }
            sessionStorage.setItem('vw_admin_pw', this.password);
            await this.loadMenu();
            this.step = 'editor';
            this.controllaBozza();
          } catch (_) {
            this.loginError = 'Errore di rete. Controlla la connessione e riprova.';
          } finally {
            this.loading = false;
          }
        },
        logout() {
          if (this._draftTimer) { clearTimeout(this._draftTimer); this._draftTimer = null; }
          sessionStorage.removeItem('vw_admin_pw');
          this.password = '';
          this.step = 'login';
        },

        // ---------- Caricamento menù ----------
        async loadMenu() {
          this.loadError = '';
          if (this._draftTimer) { clearTimeout(this._draftTimer); this._draftTimer = null; }
          // 1) Sorgente primaria: API (menu fresco da GitHub).
          try {
            const r = await this.api({ action: 'load' });
            if (r.status === 401) { this.logout(); return; }   // 401 = SOLO password errata
            if (r.status === 200 && r.body && r.body.ok && r.body.menu) {
              this.menu = this.normalizzaForma(r.body.menu);
              this.nuoveSezioni = {};
              this.erroriCampo = {};
              this.dirty = false;
              this.apriPrimaSezione();
              return;
            }
          } catch (_) { /* fallthrough al fallback */ }
          // 2) Fallback: file statico (utile in locale senza token).
          try {
            const r2 = await fetch('/data/menu.json?t=' + Date.now(), { cache: 'no-store' });
            if (r2.ok) {
              this.menu = this.normalizzaForma(await r2.json());
              this.nuoveSezioni = {};
              this.erroriCampo = {};
              this.dirty = false;
              this.apriPrimaSezione();
              return;
            }
          } catch (_) { /* noop */ }
          this.loadError = 'Impossibile caricare il menù. Controlla la connessione e riprova con "Ricarica".';
        },
        apriPrimaSezione() {
          this.sezioneAperta = (this.menu.sezioni[0] && this.menu.sezioni[0].id) || null;
        },
        async ricarica() {
          if (this.dirty && !confirm('Scartare le modifiche non salvate e ricaricare l’ultima versione dal server?')) return;
          this.publishMsg = ''; this.publishError = ''; this.avvisoValidazione = ''; this.erroriCampo = {};
          this.q = '';
          this.loading = true;
          await this.loadMenu();
          // I dati locali non rispecchiano più ciò che è online: butta la bozza.
          this.scartaBozzaStorage();
          this.bozzaDisponibile = false;
          this.loading = false;
        },

        // Garantisce la forma minima senza perdere campi sconosciuti (_note, icona, nota…).
        normalizzaForma(m) {
          m = (m && typeof m === 'object' && !Array.isArray(m)) ? m : {};
          if (!Array.isArray(m.sezioni)) m.sezioni = [];
          if (typeof m.ricerca_allergeni_attiva !== 'boolean') m.ricerca_allergeni_attiva = true;
          m.sezioni.forEach((s) => {
            if (!Array.isArray(s.items)) s.items = [];
            s.items.forEach((it) => {
              if (!Array.isArray(it.badge)) it.badge = [];
              if (!Array.isArray(it.allergeni)) it.allergeni = [];
              if (typeof it.descrizione !== 'string') it.descrizione = '';
              if (typeof it.prezzo !== 'string') it.prezzo = (it.prezzo == null ? '' : String(it.prezzo));
            });
          });
          return m;
        },

        // ---------- Helpers di rete ----------
        // Ritorna { status, body }. Nel body di rete viaggia SOLO la password (mai token).
        async api(payload) {
          const r = await fetch('/api/save-menu', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...payload, password: this.password }),
          });
          let body = null;
          try { body = await r.json(); } catch (_) { body = null; }
          return { status: r.status, body };
        },

        // ---------- Bozza locale (autosave in localStorage) ----------
        // Sostituisce "Scarica backup": le modifiche non pubblicate sopravvivono
        // alla chiusura accidentale della scheda. La cronologia git resta il backup vero.
        markDirty() {
          this.dirty = true;
          this.publishMsg = '';
          this.avvisoValidazione = '';
          this.programmaSalvataggioBozza();
        },
        programmaSalvataggioBozza() {
          if (this._draftTimer) clearTimeout(this._draftTimer);
          this._draftTimer = setTimeout(() => this.salvaBozza(), 600);
        },
        // Salva subito la bozza, annullando l'eventuale salvataggio in coda (usato a chiusura pagina).
        flushBozza() {
          if (this._draftTimer) { clearTimeout(this._draftTimer); this._draftTimer = null; }
          this.salvaBozza();
        },
        salvaBozza() {
          if (this.step !== 'editor') return;
          try {
            localStorage.setItem(this.DRAFT_KEY, JSON.stringify({
              menu: this.menu,
              nuove: this.nuoveSezioni,
              ts: Date.now(),
            }));
            this.bozzaErrore = false;
          } catch (_) {
            // localStorage non disponibile (modalità privata) o pieno: avvisa l'utente,
            // così sa che deve pubblicare per non perdere le modifiche.
            this.bozzaErrore = true;
          }
        },
        scartaBozzaStorage() {
          try { localStorage.removeItem(this.DRAFT_KEY); } catch (_) { /* noop */ }
        },
        controllaBozza() {
          this.bozzaDisponibile = false;
          try {
            const raw = localStorage.getItem(this.DRAFT_KEY);
            if (!raw) return;
            const d = JSON.parse(raw);
            if (!d || !d.menu) { this.scartaBozzaStorage(); return; }
            // Se la bozza coincide con ciò che è online, non c'è nulla da ripristinare.
            if (JSON.stringify(d.menu) === JSON.stringify(this.menu)) { this.scartaBozzaStorage(); return; }
            this.bozzaDisponibile = true;
            this.bozzaTs = d.ts || 0;
          } catch (_) { this.bozzaDisponibile = false; }
        },
        riprendiBozza() {
          try {
            const d = JSON.parse(localStorage.getItem(this.DRAFT_KEY) || 'null');
            if (d && d.menu) {
              this.menu = this.normalizzaForma(d.menu);
              this.nuoveSezioni = d.nuove || {};
              this.erroriCampo = {};
              this.dirty = true;
              this.apriPrimaSezione();
            }
          } catch (_) { /* bozza corrotta: ignora */ }
          this.bozzaDisponibile = false;
        },
        scartaBozza() {
          this.scartaBozzaStorage();
          this.bozzaDisponibile = false;
        },
        bozzaQuando() {
          if (!this.bozzaTs) return '';
          try {
            return new Date(this.bozzaTs).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
          } catch (_) { return ''; }
        },

        // ---------- Mutazioni: sezioni ----------
        slugify(str) {
          return (str || '').toString()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '') || 'sezione';
        },
        idUnivoco(base) {
          const esistenti = new Set(this.menu.sezioni.map((s) => s.id));
          const slug = this.slugify(base);
          if (!esistenti.has(slug)) return slug;
          let n = 2;
          while (esistenti.has(slug + '-' + n)) n++;
          return slug + '-' + n;
        },
        addSezione() {
          const id = this.idUnivoco('nuova-sezione');
          // icona:'' per coerenza con lo schema (ogni sezione ha icona); nota assente finché vuota.
          this.menu.sezioni.push({ id, titolo: 'Nuova sezione', icona: '', items: [] });
          this.sezioneAperta = id;
          this.nuoveSezioni[id] = true; // id definitivo (slug del titolo) calcolato al publish
          this.markDirty();
          this.$nextTick(() => this.scrollAFondo());
        },
        removeSezione(si) {
          const s = this.menu.sezioni[si];
          if (!confirm('Rimuovere la sezione "' + (s.titolo || '') + '" e tutti i suoi piatti?')) return;
          if (this.sezioneAperta === s.id) this.sezioneAperta = null;
          delete this.nuoveSezioni[s.id];
          this.menu.sezioni.splice(si, 1);
          this.erroriCampo = {}; // gli indici sono cambiati
          this.markDirty();
        },
        moveSezione(si, dir) {
          const j = si + dir;
          if (j < 0 || j >= this.menu.sezioni.length) return;
          const arr = this.menu.sezioni;
          [arr[si], arr[j]] = [arr[j], arr[si]];
          this.erroriCampo = {};
          this.markDirty();
        },
        toggleSezione(id) {
          this.sezioneAperta = (this.sezioneAperta === id) ? null : id;
        },

        // ---------- Mutazioni: piatti ----------
        addItem(s) {
          s.items.push({ nome: '', descrizione: '', prezzo: '', badge: [], allergeni: [] });
          this.sezioneAperta = s.id;
          this.markDirty();
        },
        duplicaItem(s, ii) {
          const clone = JSON.parse(JSON.stringify(s.items[ii]));
          s.items.splice(ii + 1, 0, clone);
          this.erroriCampo = {}; // gli indici successivi sono slittati
          this.markDirty();
        },
        removeItem(s, ii) {
          const it = s.items[ii];
          const nome = (it && it.nome && it.nome.trim()) ? ('"' + it.nome.trim() + '"') : 'questo piatto';
          if (!confirm('Rimuovere ' + nome + '?')) return;
          s.items.splice(ii, 1);
          this.erroriCampo = {};
          this.markDirty();
        },
        moveItem(s, ii, dir) {
          const j = ii + dir;
          if (j < 0 || j >= s.items.length) return;
          [s.items[ii], s.items[j]] = [s.items[j], s.items[ii]];
          this.erroriCampo = {};
          this.markDirty();
        },

        // ---------- Badge / allergeni (multi-select) ----------
        toggleBadge(it, b) {
          const i = it.badge.indexOf(b);
          if (i === -1) it.badge.push(b); else it.badge.splice(i, 1);
          this.markDirty();
        },
        toggleAllergene(it, a) {
          const i = it.allergeni.indexOf(a);
          if (i === -1) it.allergeni.push(a); else it.allergeni.splice(i, 1);
          this.markDirty();
        },

        // ---------- Prezzo ----------
        // Normalizza in "X,YY": 12 → 12,00 · 12.5 → 12,50 · "3,00" invariato.
        normalizzaPrezzo(it) {
          let v = (it.prezzo == null ? '' : String(it.prezzo)).trim();
          if (v === '') return;
          v = v.replace(/€/g, '').replace(/\s/g, '');
          // Input ambiguo (più separatori, es. separatore migliaia "1.234,56"):
          // non normalizzare, lascia che la validazione lo segnali invece di corromperlo.
          if ((v.match(/[.,]/g) || []).length > 1) return;
          v = v.replace(',', '.');
          const n = parseFloat(v);
          if (isNaN(n) || !isFinite(n)) return; // non numerico → lo segnalerà la validazione
          const nuovo = n.toFixed(2).replace('.', ',');
          if (nuovo !== it.prezzo) { it.prezzo = nuovo; this.markDirty(); }
        },
        // Al blur: normalizza e accendi/spegni l'errore inline del prezzo.
        onPrezzoBlur(it, si, ii) {
          this.normalizzaPrezzo(it);
          const v = (it.prezzo || '').trim();
          if (v === '') { this.setErrore(si, ii, 'prezzo', null); return; } // vuoto: lo segnala il publish
          this.setErrore(si, ii, 'prezzo', /^\d+,\d{2}$/.test(v) ? null : 'Usa il formato 12,00 (virgola e 2 decimali).');
        },
        onPrezzoInput(it, si, ii) {
          this.markDirty();
          this.setErrore(si, ii, 'prezzo', null); // togli il rosso mentre correggono; riconvalida al blur
        },
        onNomeInput(it, si, ii) {
          this.markDirty();
          if ((it.nome || '').trim()) this.setErrore(si, ii, 'nome', null);
        },

        // ---------- Validazione inline per-campo ----------
        keyCampo(si, ii) { return si + '-' + ii; },
        erroreDi(si, ii, campo) {
          const e = this.erroriCampo[this.keyCampo(si, ii)];
          return (e && e[campo]) || '';
        },
        setErrore(si, ii, campo, msg) {
          const k = this.keyCampo(si, ii);
          const next = { ...this.erroriCampo };
          const ce = { ...(next[k] || {}) };
          if (msg) ce[campo] = msg; else delete ce[campo];
          if (Object.keys(ce).length) next[k] = ce; else delete next[k];
          this.erroriCampo = next; // riassegno l'oggetto intero → reattività garantita
        },
        contaErrori() {
          let n = 0;
          for (const k in this.erroriCampo) n += Object.keys(this.erroriCampo[k]).length;
          return n;
        },
        // Valida tutti i campi, popola erroriCampo, ritorna il PRIMO errore {si,ii,campo} o null.
        validaCampi() {
          const errs = {};
          let primo = null;
          const prezzoRe = /^\d+,\d{2}$/;
          this.menu.sezioni.forEach((s, si) => {
            (s.items || []).forEach((it, ii) => {
              const ce = {};
              if (!(it.nome || '').trim()) { ce.nome = 'Il nome è obbligatorio.'; if (!primo) primo = { si, ii, campo: 'nome' }; }
              if (!prezzoRe.test((it.prezzo || '').trim())) { ce.prezzo = 'Usa il formato 12,00 (virgola e 2 decimali).'; if (!primo) primo = { si, ii, campo: 'prezzo' }; }
              if (Object.keys(ce).length) errs[si + '-' + ii] = ce;
            });
          });
          this.erroriCampo = errs;
          return primo;
        },
        focusPrimoErrore(primo) {
          const el = document.getElementById('f-' + primo.campo + '-' + primo.si + '-' + primo.ii);
          if (!el) return;
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); }
        },

        // Prepara il payload: clone pulito, trim, rimozione di nota vuota e
        // assegnazione dell'id definitivo (slug del titolo) alle SOLE sezioni
        // nuove. Gli id delle sezioni esistenti NON vengono mai cambiati.
        preparaMenu() {
          const m = JSON.parse(JSON.stringify(this.menu));
          const usati = new Set();
          (m.sezioni || []).forEach((s) => { if (!this.nuoveSezioni[s.id]) usati.add(s.id); });
          (m.sezioni || []).forEach((s) => {
            if (typeof s.titolo === 'string') s.titolo = s.titolo.trim();
            // Sezione nuova → id = slug univoco del titolo.
            if (this.nuoveSezioni[s.id]) {
              const base = this.slugify(s.titolo);
              let id = base, n = 2;
              while (usati.has(id)) id = base + '-' + (n++);
              s.id = id;
              usati.add(id);
            }
            if (typeof s.nota === 'string' && s.nota.trim() === '') delete s.nota;
            else if (typeof s.nota === 'string') s.nota = s.nota.trim();
            (s.items || []).forEach((it) => {
              if (typeof it.nome === 'string') it.nome = it.nome.trim();
              if (typeof it.descrizione === 'string') it.descrizione = it.descrizione.trim();
            });
          });
          return m;
        },

        // ---------- Pubblicazione ----------
        async publish() {
          if (this.publishing) return; // blocca il doppio tap
          this.publishMsg = ''; this.publishError = ''; this.avvisoValidazione = '';
          this.normalizzaTutto();
          const primo = this.validaCampi();
          if (primo) {
            const n = this.contaErrori();
            this.avvisoValidazione = (n === 1)
              ? 'C’è 1 campo da correggere (evidenziato in rosso).'
              : ('Ci sono ' + n + ' campi da correggere (evidenziati in rosso).');
            this.q = ''; // svuota la ricerca così il campo è sicuramente visibile
            const s = this.menu.sezioni[primo.si];
            if (s) this.sezioneAperta = s.id;
            this.$nextTick(() => this.focusPrimoErrore(primo));
            return;
          }
          if (!confirm('Pubblicare ora? Le modifiche saranno online tra circa 1 minuto.')) return;
          this.publishing = true;
          try {
            const r = await this.api({ action: 'publish', menu: this.preparaMenu() });
            if (r.status === 401) { this.publishError = 'Sessione scaduta: rifai il login.'; this.logout(); return; }
            if (r.status === 200 && r.body && r.body.ok) {
              this.publishMsg = 'Pubblicato! Il menù sarà online tra circa 1 minuto.';
              this.dirty = false;
              this.scartaBozzaStorage();
              this.bozzaDisponibile = false;
              await this.loadMenu();   // ricarica fresco dal server
              this.scrollSu();
            } else {
              this.publishError = (r.body && r.body.error) || ('Errore durante la pubblicazione (codice ' + r.status + '). Riprova.');
            }
          } catch (_) {
            this.publishError = 'Pubblicazione non riuscita: sembri offline o la connessione è caduta. Controlla e riprova.';
          } finally {
            this.publishing = false;
          }
        },
        normalizzaTutto() {
          this.menu.sezioni.forEach((s) => s.items.forEach((it) => this.normalizzaPrezzo(it)));
        },

        // ---------- Ricerca piatti ----------
        normTesto(str) {
          return (str || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
        },
        ricercaAttiva() { return this.q.trim().length > 0; },
        queryNorm() { return this.normTesto(this.q); },
        matchTesto(str) { return this.normTesto(str).includes(this.queryNorm()); },
        matchPiatto(it) { return this.matchTesto(it.nome) || this.matchTesto(it.descrizione); },
        sezioneHaMatch(s) {
          if (this.matchTesto(s.titolo)) return true;
          return (s.items || []).some((it) => this.matchPiatto(it));
        },
        sezioneVisibile(s) { return this.ricercaAttiva() ? this.sezioneHaMatch(s) : true; },
        itemVisibile(s, it) {
          if (!this.ricercaAttiva()) return true;
          if (this.matchTesto(s.titolo)) return true; // titolo sezione che matcha → mostra tutti i suoi piatti
          return this.matchPiatto(it);
        },
        isOpen(s) {
          if (this.ricercaAttiva()) return this.sezioneHaMatch(s); // in ricerca i risultati sono sempre aperti
          return this.sezioneAperta === s.id;
        },
        contaRisultati() {
          let n = 0;
          this.menu.sezioni.forEach((s) => {
            if (!this.sezioneHaMatch(s)) return;
            (s.items || []).forEach((it) => { if (this.itemVisibile(s, it)) n++; });
          });
          return n;
        },

        // ---------- Util UI ----------
        scrollSu() { window.scrollTo({ top: 0, behavior: 'smooth' }); },
        scrollAFondo() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); },
        contaPiatti(s) { return (s.items || []).length; },
        etichettaPiatti(s) {
          const n = this.contaPiatti(s);
          return n + (n === 1 ? ' piatto' : ' piatti');
        },
      }));
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>

<body class="vw-cms">
  <div x-data="vwEditor()" x-cloak>

    <!-- ===================== BOOT (auto-login) ===================== -->
    <!-- Spinner mentre si riverifica la password salvata: evita il flash della card login. -->
    <main class="vw-cms-login" x-show="booting" x-cloak>
      <div class="vw-cms-login__card">
        <img src="assets/img/logo-vw-sm.png" alt="Vecchio West" width="64" height="64" class="vw-cms-login__logo" />
        <p class="vw-cms-login__sub">Verifica accesso…</p>
      </div>
    </main>

    <!-- ============================== LOGIN ============================== -->
    <main class="vw-cms-login" x-show="step === 'login' && !booting" x-cloak>
      <div class="vw-cms-login__card">
        <img src="assets/img/logo-vw-sm.png" alt="Vecchio West" width="64" height="64" class="vw-cms-login__logo" />
        <h1 class="vw-cms-login__title">Gestione menù</h1>
        <p class="vw-cms-login__sub">Area riservata · accedi per modificare il menù</p>

        <form @submit.prevent="login()">
          <label class="vw-cms-field">
            <span class="vw-cms-field__label">Utente</span>
            <input
              type="text"
              class="vw-cms-input"
              x-model="username"
              autocomplete="username"
              autocapitalize="none"
              autocorrect="off"
              :disabled="loading"
              required
            />
          </label>
          <label class="vw-cms-field">
            <span class="vw-cms-field__label">Password</span>
            <input
              type="password"
              class="vw-cms-input"
              x-model="password"
              autocomplete="current-password"
              :disabled="loading"
              required
            />
          </label>
          <p class="vw-cms-error" x-show="loginError" x-text="loginError" x-cloak></p>
          <button type="submit" class="vw-btn vw-cms-login__btn" :disabled="loading">
            <span class="vw-cms-spinner" x-show="loading" x-cloak aria-hidden="true"></span>
            <span x-text="loading ? 'Verifica…' : 'Entra'"></span>
          </button>
        </form>
      </div>
    </main>

    <!-- ============================== EDITOR ============================== -->
    <template x-if="step === 'editor'">
      <div class="vw-cms-editor" :class="{ 'is-searching': ricercaAttiva() }">

        <header class="vw-cms-head">
          <div class="vw-cms-head__left">
            <img src="assets/img/logo-vw-sm.png" alt="" width="40" height="40" />
            <div>
              <h1 class="vw-cms-head__title">Modifica menù</h1>
              <p class="vw-cms-head__sub">Aggiungi, modifica o togli piatti, poi premi Pubblica.</p>
            </div>
          </div>
          <button type="button" class="vw-cms-link" @click="logout()">Esci</button>
        </header>

        <!-- Barra di ricerca (sticky) -->
        <div class="vw-cms-toolbar">
          <div class="vw-cms-search">
            <span class="vw-cms-search__icon" aria-hidden="true">🔎</span>
            <input
              id="vw-cms-cerca"
              type="search"
              class="vw-cms-search__input"
              x-model="q"
              placeholder="Cerca un piatto…"
              aria-label="Cerca un piatto per nome o ingrediente"
              autocomplete="off"
              autocapitalize="none"
              autocorrect="off"
              enterkeyhint="search"
            />
            <button type="button" class="vw-cms-search__clear" x-show="ricercaAttiva()" @click="q = ''" aria-label="Svuota la ricerca" x-cloak>✕</button>
          </div>
        </div>

        <!-- Riga risultati ricerca -->
        <p class="vw-cms-search-info" x-show="ricercaAttiva()" x-cloak>
          <span x-show="contaRisultati() > 0" x-text="contaRisultati() === 1 ? '1 piatto trovato' : (contaRisultati() + ' piatti trovati')"></span>
          <span x-show="contaRisultati() === 0">Nessun piatto trovato. Prova con un altro nome.</span>
          <button type="button" class="vw-cms-link" @click="q = ''">Svuota</button>
        </p>

        <!-- Prompt ripristino bozza -->
        <div class="vw-cms-bozza" x-show="bozzaDisponibile" x-cloak>
          <div class="vw-cms-bozza__txt">
            <strong>Hai modifiche non pubblicate</strong>
            <span>Salvate sul telefono il <span x-text="bozzaQuando()"></span>. Vuoi riprenderle?</span>
          </div>
          <div class="vw-cms-bozza__actions">
            <button type="button" class="vw-btn vw-cms-bozza__resume" @click="riprendiBozza()">Riprendi modifiche</button>
            <button type="button" class="vw-btn vw-btn--ghost" @click="scartaBozza()">Scarta</button>
          </div>
        </div>

        <!-- Esiti / errori (aree live per screen reader) -->
        <div class="vw-cms-banner vw-cms-banner--ok" x-show="publishMsg" x-cloak role="status" aria-live="polite">
          <span class="vw-cms-banner__icon" aria-hidden="true">✓</span>
          <span x-text="publishMsg"></span>
        </div>
        <div class="vw-cms-banner vw-cms-banner--err" x-show="publishError" x-cloak role="alert">
          <span class="vw-cms-banner__icon" aria-hidden="true">!</span>
          <span x-text="publishError"></span>
        </div>
        <div class="vw-cms-banner vw-cms-banner--err" x-show="loadError" x-cloak role="alert">
          <span class="vw-cms-banner__icon" aria-hidden="true">!</span>
          <span x-text="loadError"></span>
        </div>
        <div class="vw-cms-banner vw-cms-banner--warn" x-show="avvisoValidazione" x-cloak role="alert">
          <span class="vw-cms-banner__icon" aria-hidden="true">!</span>
          <span x-text="avvisoValidazione"></span>
        </div>
        <div class="vw-cms-banner vw-cms-banner--warn" x-show="bozzaErrore" x-cloak role="alert">
          <span class="vw-cms-banner__icon" aria-hidden="true">!</span>
          <span>Questo browser non salva le modifiche in automatico (modalità privata o memoria piena). Pubblica appena puoi per non perderle.</span>
        </div>

        <!-- Impostazione globale (nascosta durante la ricerca per ridurre il rumore) -->
        <div class="vw-cms-toggle" x-show="!ricercaAttiva()">
          <label class="vw-cms-switch">
            <input type="checkbox" x-model="menu.ricerca_allergeni_attiva" @change="markDirty()" />
            <span class="vw-cms-switch__track"><span class="vw-cms-switch__thumb"></span></span>
            <span class="vw-cms-switch__label">Mostra il filtro allergeni sul sito</span>
          </label>
        </div>

        <!-- Sezioni (accordion: una aperta per volta) -->
        <div class="vw-cms-sezioni">
          <template x-for="(s, si) in menu.sezioni" :key="s.id">
            <section class="vw-cms-sez" :class="{ 'is-open': isOpen(s) }" x-show="sezioneVisibile(s)" x-cloak>

              <!-- Testata sezione (sticky quando aperta) -->
              <div class="vw-cms-sez__head">
                <button type="button" class="vw-cms-sez__toggle" @click="toggleSezione(s.id)" :aria-expanded="isOpen(s).toString()">
                  <span class="vw-cms-sez__chev" aria-hidden="true">▸</span>
                  <span class="vw-cms-sez__titolo" x-text="s.titolo || 'Senza titolo'"></span>
                  <span class="vw-cms-sez__count" x-text="etichettaPiatti(s)"></span>
                </button>
                <div class="vw-cms-sez__ord">
                  <button type="button" class="vw-cms-iconbtn" title="Sposta sezione su" aria-label="Sposta sezione su" @click="moveSezione(si, -1)" :disabled="ricercaAttiva() || si === 0">▲</button>
                  <button type="button" class="vw-cms-iconbtn" title="Sposta sezione giù" aria-label="Sposta sezione giù" @click="moveSezione(si, 1)" :disabled="ricercaAttiva() || si === menu.sezioni.length - 1">▼</button>
                  <button type="button" class="vw-cms-iconbtn vw-cms-iconbtn--danger" title="Rimuovi sezione" aria-label="Rimuovi sezione" @click="removeSezione(si)">✕</button>
                </div>
              </div>

              <!-- Corpo sezione -->
              <div class="vw-cms-sez__body" x-show="isOpen(s)" x-cloak>
                <div class="vw-cms-grid2">
                  <label class="vw-cms-field">
                    <span class="vw-cms-field__label">Titolo sezione</span>
                    <input type="text" class="vw-cms-input" x-model="s.titolo" @input="markDirty()" />
                  </label>
                  <label class="vw-cms-field">
                    <span class="vw-cms-field__label">Nota <small>(opzionale)</small></span>
                    <input type="text" class="vw-cms-input" x-model="s.nota" @input="markDirty()" placeholder="es. Aggiunte: formaggio +1,00 €" />
                  </label>
                </div>

                <!-- Piatti -->
                <div class="vw-cms-piatti">
                  <template x-for="(it, ii) in s.items" :key="ii">
                    <article class="vw-cms-piatto" x-show="itemVisibile(s, it)" x-cloak>
                      <div class="vw-cms-piatto__top">
                        <span class="vw-cms-piatto__n" x-text="'#' + (ii + 1)"></span>
                        <div class="vw-cms-piatto__ord">
                          <button type="button" class="vw-cms-iconbtn" title="Sposta piatto su" aria-label="Sposta piatto su" @click="moveItem(s, ii, -1)" :disabled="ricercaAttiva() || ii === 0">▲</button>
                          <button type="button" class="vw-cms-iconbtn" title="Sposta piatto giù" aria-label="Sposta piatto giù" @click="moveItem(s, ii, 1)" :disabled="ricercaAttiva() || ii === s.items.length - 1">▼</button>
                          <button type="button" class="vw-cms-iconbtn" title="Duplica piatto" aria-label="Duplica piatto" @click="duplicaItem(s, ii)">⧉</button>
                          <button type="button" class="vw-cms-iconbtn vw-cms-iconbtn--danger" title="Rimuovi piatto" aria-label="Rimuovi piatto" @click="removeItem(s, ii)">✕</button>
                        </div>
                      </div>

                      <div class="vw-cms-grid-nome">
                        <label class="vw-cms-field">
                          <span class="vw-cms-field__label">Nome *</span>
                          <input
                            type="text"
                            class="vw-cms-input"
                            :class="{ 'is-error': erroreDi(si, ii, 'nome') }"
                            :id="'f-nome-' + si + '-' + ii"
                            :aria-invalid="erroreDi(si, ii, 'nome') ? 'true' : 'false'"
                            :aria-describedby="erroreDi(si, ii, 'nome') ? 'err-nome-' + si + '-' + ii : null"
                            x-model="it.nome"
                            @input="onNomeInput(it, si, ii)"
                            placeholder="Nome del piatto"
                          />
                          <span class="vw-cms-campo-err" :id="'err-nome-' + si + '-' + ii" x-show="erroreDi(si, ii, 'nome')" x-text="erroreDi(si, ii, 'nome')" x-cloak></span>
                        </label>
                        <label class="vw-cms-field vw-cms-field--prezzo">
                          <span class="vw-cms-field__label">Prezzo</span>
                          <div class="vw-cms-prezzo" :class="{ 'is-error': erroreDi(si, ii, 'prezzo') }">
                            <span class="vw-cms-prezzo__euro" aria-hidden="true">€</span>
                            <input
                              type="text"
                              inputmode="decimal"
                              class="vw-cms-input vw-cms-prezzo__input"
                              :id="'f-prezzo-' + si + '-' + ii"
                              aria-label="Prezzo in euro"
                              :aria-invalid="erroreDi(si, ii, 'prezzo') ? 'true' : 'false'"
                              :aria-describedby="erroreDi(si, ii, 'prezzo') ? 'err-prezzo-' + si + '-' + ii : null"
                              x-model="it.prezzo"
                              @input="onPrezzoInput(it, si, ii)"
                              @blur="onPrezzoBlur(it, si, ii)"
                              placeholder="12,00"
                            />
                          </div>
                          <span class="vw-cms-campo-err" :id="'err-prezzo-' + si + '-' + ii" x-show="erroreDi(si, ii, 'prezzo')" x-text="erroreDi(si, ii, 'prezzo')" x-cloak></span>
                        </label>
                      </div>

                      <label class="vw-cms-field">
                        <span class="vw-cms-field__label">Descrizione</span>
                        <textarea class="vw-cms-input vw-cms-textarea" rows="2" x-model="it.descrizione" @input="markDirty()" placeholder="Ingredienti / dettagli"></textarea>
                      </label>

                      <div class="vw-cms-chips-group" role="group" aria-label="Badge del piatto">
                        <span class="vw-cms-field__label">Badge</span>
                        <div class="vw-cms-chips">
                          <template x-for="b in BADGES" :key="b">
                            <button type="button" class="vw-chip vw-chip--toggle" :class="{ 'is-active': it.badge.includes(b) }" :aria-pressed="it.badge.includes(b).toString()" :aria-label="'Badge ' + b" @click="toggleBadge(it, b)" x-text="b"></button>
                          </template>
                        </div>
                      </div>

                      <div class="vw-cms-chips-group" role="group" aria-label="Allergeni del piatto">
                        <span class="vw-cms-field__label">Allergeni</span>
                        <div class="vw-cms-chips">
                          <template x-for="a in ALLERGENI" :key="a">
                            <button type="button" class="vw-chip vw-chip--toggle" :class="{ 'is-active': it.allergeni.includes(a) }" :aria-pressed="it.allergeni.includes(a).toString()" :aria-label="'Allergene ' + a" @click="toggleAllergene(it, a)" x-text="a"></button>
                          </template>
                        </div>
                      </div>
                    </article>
                  </template>

                  <p class="vw-cms-vuoto" x-show="s.items.length === 0" x-cloak>Nessun piatto in questa sezione.</p>
                  <button type="button" class="vw-btn vw-btn--ghost vw-cms-add" x-show="!ricercaAttiva()" @click="addItem(s)">+ Aggiungi piatto</button>
                </div>
              </div>
            </section>
          </template>
        </div>

        <button type="button" class="vw-btn vw-btn--ghost vw-cms-add-sez" x-show="!ricercaAttiva()" @click="addSezione()">+ Aggiungi sezione</button>

        <!-- Spazio per non finire sotto la barra azioni -->
        <div class="vw-cms-spacer" aria-hidden="true"></div>

        <!-- Torna su -->
        <button type="button" class="vw-cms-top" x-show="mostraTornaSu" @click="scrollSu()" title="Torna su" aria-label="Torna su" x-cloak>↑</button>

        <!-- Barra azioni fissa (comoda al pollice) -->
        <div class="vw-cms-bar">
          <div class="vw-cms-bar__status">
            <span class="vw-cms-dot" :class="dirty ? 'is-dirty' : 'is-clean'" aria-hidden="true"></span>
            <span x-text="dirty ? 'Modifiche non salvate' : 'Tutto salvato'"></span>
          </div>
          <div class="vw-cms-bar__actions">
            <button type="button" class="vw-btn vw-btn--ghost vw-cms-bar__reload" @click="ricarica()" :disabled="loading || publishing">
              <span x-text="loading ? 'Carico…' : 'Ricarica'"></span>
            </button>
            <button type="button" class="vw-btn vw-cms-bar__publish" @click="publish()" :disabled="publishing || loading">
              <span class="vw-cms-spinner" x-show="publishing" x-cloak aria-hidden="true"></span>
              <span x-text="publishing ? 'Pubblico…' : 'Pubblica'"></span>
            </button>
          </div>
        </div>

      </div>
    </template>
  </div>
</body>
</html>
